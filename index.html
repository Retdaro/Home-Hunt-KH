<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Hunt KH </title>
  
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #fdfbf7;
    }

    /* ah nis header */
    header {
      background-color: #5A3615; 
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    /* ah nis logo */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px; 
    }

    .logo-img {
      height: 50px; 
      width: auto;  
    }

    nav {
      display: flex;                     /* under line nv nav*/
      gap: 30px; 
    }
    nav a {
      color: #f3e8df;
      text-decoration: none;
      font-size: 18px;
      padding-bottom: 5px;
      position: relative;
      margin-left: 35px;
    }
    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px; 
      bottom: 0;
      left: 0;
      background-color: #d4a373; 
      transition: width 0.3s ease;
    }
    nav a:hover::after {
      width: 100%;
    }
    nav a.active::after {
      width: 100%;
    }
                /* Jol dol hero section*/
    .hero {
      width: 100%;   
      height: 500px;
      background-image: url(/img/bg.png); 
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding-left: 60px;
    }

    .hero-content {
      max-width: 400px;
    }

    .subtitle {
      font-size: 12px;
      font-weight: bold;
      color: #665b53;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      color: #4a2c17;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .text {
      font-size: 14px;
      color: #554a43;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background-color: #5A3615;
      color: white;
      padding: 12px 26px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }

    .button:hover {
      background-color: #3b2617;
    }
    /* Laptop */
.container {
    display: flex;
    gap: 20px;
}
    
    @media (max-width: 700px) {
    .container {
        flex-direction: column;
    }

    .menu {
        flex-direction: column;
    }

    img {
        width: 100%;
    }
}


  </style>
</head>
<body>

  <header>
        <div class="logo-container">
            <img src="/img/logo-white.png" alt="Home Hunt KH Logo" class="logo-img">
            
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Listings</a>
            <a href="#">Book a Visits</a>
        </nav>
  </header>

                 <!-- Jol dol hero section-->
  <section class="hero">
    <div class="hero-content">
      <p class="subtitle">WELCOME TO HOME HUNT KH</p>
      <h1 class="title">Your Perfect Stay<br>Awaits</h1>
      <p class="text">
        Experience luxury, comfort, and breathtaking views in the heart of the city. Book your stay today and make unforgettable memories.
      </p>
      <a href="#" class="button">Explore listings</a>
    </div>
  </section>

</body>
</html>
